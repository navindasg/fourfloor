[package]
name = "fourfloor-ml"
description = "Machine-learning features for fourfloor, restricted to openly licensed weights"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
# Text and audio embeddings with LAION CLAP (about 205 MB of weights on first
# use). Adds the Hugging Face tokenizer.
clap = ["dep:tokenizers"]

[dependencies]
fourfloor-core = { workspace = true }
fourfloor-audio = { workspace = true }
fourfloor-model = { workspace = true }
# Hand-made audio features for the embedding fallback.
fourfloor-analysis = { workspace = true }
# MIT OR Apache-2.0. Pure-Rust ONNX inference; no native runtime to ship.
tract-onnx = "0.23"
rustfft = "6.4.1" # MIT OR Apache-2.0
sha2 = "0.11" # MIT OR Apache-2.0. Model checksums.
blake3 = "1.8" # CC0-1.0 OR Apache-2.0. Content hashes for the stem cache.
ureq = "3.4" # MIT OR Apache-2.0. Model downloads over HTTPS (rustls).
thiserror = "2" # MIT OR Apache-2.0
serde = { workspace = true }
serde_json = { workspace = true }
# Apache-2.0. Byte-level BPE for the CLAP text encoder; pure-Rust regex.
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"], optional = true }

[dev-dependencies]
fourfloor-testkit = { workspace = true }
fourfloor-instruments = { workspace = true }
fourfloor-engine = { workspace = true }
tempfile = "3" # MIT OR Apache-2.0
