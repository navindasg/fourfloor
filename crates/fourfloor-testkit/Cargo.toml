[package]
name = "fourfloor-testkit"
description = "Offline render and audio assertion helpers for fourfloor tests"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
fourfloor-core = { workspace = true }
fourfloor-engine = { workspace = true }
fourfloor-model = { workspace = true }
fourfloor-compile = { workspace = true }
fourfloor-audio = { workspace = true }
rustfft = "6.4.1" # MIT OR Apache-2.0
# BSD-1-Clause. Default features off so the guard also works in release
# test builds (see fourfloor-engine).
assert_no_alloc = { version = "1.1", default-features = false }

[dev-dependencies]
tempfile = "3" # MIT OR Apache-2.0
