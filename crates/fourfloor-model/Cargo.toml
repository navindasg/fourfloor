[package]
name = "fourfloor-model"
description = "Edit model, command bus and project format for fourfloor"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
fourfloor-core = { workspace = true, features = ["serde"] }
# `rc` lets serde see through the Arc used for structural sharing.
serde = { workspace = true, features = ["rc"] } # MIT OR Apache-2.0
serde_json = { workspace = true } # MIT OR Apache-2.0
thiserror = "2" # MIT OR Apache-2.0
schemars = "1" # MIT
blake3 = "1" # CC0-1.0 OR Apache-2.0 OR Apache-2.0 WITH LLVM-exception (used under Apache-2.0)

[dev-dependencies]
tempfile = "3" # MIT OR Apache-2.0
