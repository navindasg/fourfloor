[package]
name = "fourfloor-spikes"
description = "Phase 0 validation spikes for fourfloor"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
fourfloor-core = { workspace = true }
# Licenses below are as read from each crate's published Cargo.toml.
clack-host = { version = "0.2.0", optional = true } # MIT OR Apache-2.0
signalsmith-stretch = { version = "0.1.3", optional = true } # MIT (C++ via cc + bindgen)
truce-rack = { version = "1.1.5", default-features = false, features = ["clap", "vst3", "au"], optional = true } # MIT OR Apache-2.0

[features]
# Every remaining spike needs a C/C++ toolchain or loads foreign plugin
# binaries, so all are opt-in. The metering, decode and offline stretch
# spikes graduated to `fourfloor-audio` (stretch behind its `stretch`
# feature); plugin hosting graduated to `fourfloor-host` (clack-host plus its
# own Audio Unit bindings). What is left here is kept for reference.
default = []
stretch = ["dep:signalsmith-stretch"]
hosting-truce = ["dep:truce-rack"]
hosting-clack = ["dep:clack-host"]

[dev-dependencies]
rustfft = "6.4.1" # MIT OR Apache-2.0

[[example]]
name = "scan_plugins"
required-features = ["hosting-truce"]

[[example]]
name = "scan_clap_clack"
required-features = ["hosting-clack"]

[[example]]
name = "stretch_sine"
required-features = ["stretch"]
