[package]
name = "fourfloor-dj"
description = "DJ decks for fourfloor: deck transport, sync, crossfader, cueing"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
# Key lock through Signalsmith Stretch (MIT; C++ built by `cc`, bound by
# `bindgen`, so it needs a C++ compiler and libclang). Without it key lock
# uses the built-in pure-Rust WSOLA stretcher.
stretch = ["dep:signalsmith-stretch"]

[dependencies]
fourfloor-core = { workspace = true }
fourfloor-engine = { workspace = true }
fourfloor-audio = { workspace = true }
fourfloor-analysis = { workspace = true }
fourfloor-effects = { workspace = true }
rtrb = "0.4" # MIT OR Apache-2.0
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "2" # MIT OR Apache-2.0
signalsmith-stretch = { version = "0.1.3", optional = true } # MIT

[dev-dependencies]
fourfloor-testkit = { workspace = true }
tempfile = "3" # MIT OR Apache-2.0
assert_no_alloc = { version = "1.1", default-features = false } # BSD-2-Clause
