[package]
name = "fourfloor-host"
description = "Plugin hosting for fourfloor: CLAP, VST3 and Audio Unit wrappers"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
fourfloor-core = { workspace = true, features = ["serde"] }
clack-host = "0.2.0" # MIT OR Apache-2.0
clack-extensions = { version = "0.2.0", features = ["clack-host", "audio-ports", "note-ports", "latency", "params", "state", "log", "thread-check"] } # MIT OR Apache-2.0
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
fourfloor-testkit = { workspace = true }
fourfloor-engine = { workspace = true }
fourfloor-model = { workspace = true }
fourfloor-compile = { workspace = true }
tempfile = "3" # MIT OR Apache-2.0
libloading = "0.8" # ISC
