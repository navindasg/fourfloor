[package]
name = "fourfloor-analysis"
description = "Offline audio analysis for fourfloor: tempo, key, onsets, spectrum"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
# Derives Serialize/Deserialize on the result types, for the agent and the
# library index.
serde = ["dep:serde"]

[dependencies]
fourfloor-core = { workspace = true }
fourfloor-audio = { workspace = true }
rustfft = "6.4.1" # MIT OR Apache-2.0
thiserror = "2" # MIT OR Apache-2.0
serde = { workspace = true, optional = true }

[dev-dependencies]
fourfloor-testkit = { workspace = true }
fourfloor-instruments = { workspace = true }
fourfloor-engine = { workspace = true }
fourfloor-model = { workspace = true }
tempfile = "3" # MIT OR Apache-2.0
serde_json = { workspace = true }
