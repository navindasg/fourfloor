[package]
name = "fourfloor-app"
description = "The fourfloor desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "fourfloor_app"
path = "src/lib.rs"

[[bin]]
name = "fourfloor-app"
path = "src/main.rs"

[features]
default = ["audio", "dialogs", "midi"]
# Realtime output through cpal. Without it the app runs with a silent
# offline engine (still compiles and meters the project).
audio = ["dep:cpal"]
# Native open/save dialogs through rfd. Without it paths are typed in.
dialogs = ["dep:rfd"]
# MIDI controller input through midir (engine `midi` feature).
midi = ["fourfloor-engine/midi"]
# Text search in the sample browser through LAION CLAP embeddings
# (Apache-2.0 weights, about 205 MB downloaded on first use).
clap-search = ["fourfloor-ml/clap"]

[dependencies]
fourfloor-core = { workspace = true }
fourfloor-engine = { workspace = true }
fourfloor-model = { workspace = true }
fourfloor-compile = { workspace = true }
fourfloor-audio = { workspace = true }
fourfloor-analysis = { workspace = true }
fourfloor-instruments = { workspace = true }
fourfloor-effects = { workspace = true }
fourfloor-host = { workspace = true }
fourfloor-dawproject = { workspace = true }
fourfloor-dj = { workspace = true }
fourfloor-library = { workspace = true }
fourfloor-agent = { workspace = true }
fourfloor-ml = { workspace = true }
# MIT. Runs the agent's MCP server and chat backend off the UI thread.
tokio = { version = "1", features = ["rt-multi-thread"] }
serde = { workspace = true }
serde_json = { workspace = true }
# MIT OR Apache-2.0: egui on wgpu, one native window.
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "clipboard", "links", "x11", "wayland"] }
egui = "0.37" # MIT OR Apache-2.0
cpal = { version = "0.18", optional = true } # Apache-2.0
rtrb = "0.4" # MIT OR Apache-2.0
thiserror = "2" # MIT OR Apache-2.0
rfd = { version = "0.17", optional = true } # MIT

[dev-dependencies]
fourfloor-testkit = { workspace = true }
egui_kittest = { version = "0.37", features = ["snapshot", "wgpu"] } # MIT OR Apache-2.0
tempfile = "3" # MIT OR Apache-2.0
image = { version = "0.25", default-features = false, features = ["png"] } # MIT OR Apache-2.0
# BSD-2-Clause. Default features off so the guard also exists in release.
assert_no_alloc = { version = "1.1", default-features = false }
