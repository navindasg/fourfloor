[package]
name = "fourfloor-audio"
description = "Audio file decode and encode, resampling and loudness metering for fourfloor"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
fourfloor-core = { workspace = true }
ebur128 = "0.1.10" # MIT
# MPL-2.0, pure Rust. WAV and PCM are tested in this crate; the other
# formats are enabled for the library and DJ crates.
symphonia = { version = "0.6.1", default-features = false, features = ["wav", "pcm", "aiff", "flac", "mp3", "ogg", "vorbis"] }
thiserror = "2" # MIT OR Apache-2.0
# Pitch-preserving offline time stretch (`stretch` module). MIT; builds C++
# with `cc` and binds it with `bindgen`, so it needs a C++ toolchain and
# libclang, and is off by default.
signalsmith-stretch = { version = "0.1.3", optional = true }

[features]
default = []
stretch = ["dep:signalsmith-stretch"]

[dev-dependencies]
tempfile = "3" # MIT OR Apache-2.0
rustfft = "6.4.1" # MIT OR Apache-2.0
