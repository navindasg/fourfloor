[package]
name = "fourfloor-dawproject"
description = "DAWproject and Standard MIDI File import and export for fourfloor"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
fourfloor-core = { workspace = true }
fourfloor-model = { workspace = true }
fourfloor-audio = { workspace = true }
serde = { workspace = true } # MIT OR Apache-2.0
serde_json = { workspace = true } # MIT OR Apache-2.0
thiserror = "2" # MIT OR Apache-2.0
roxmltree = "0.21" # MIT OR Apache-2.0
# Deflate only, through the pure-Rust zlib-rs backend: DAWproject files are
# plain ZIP archives and need nothing else.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] } # MIT

[dev-dependencies]
fourfloor-testkit = { workspace = true }
fourfloor-compile = { workspace = true }
fourfloor-engine = { workspace = true }
fourfloor-instruments = { workspace = true }
fourfloor-effects = { workspace = true }
tempfile = "3" # MIT OR Apache-2.0
